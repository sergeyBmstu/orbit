<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Join</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #build-info {
      position: fixed;
      bottom: 16px;
      right: 20px;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      user-select: none;
      line-height: 1.6;
    }
    body {
      background: #0a0a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 380px; width: 100%; }
    h1 { font-size: 32px; margin-bottom: 40px; }
    input {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      border: 2px solid #0af;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      margin-bottom: 20px;
      text-align: center;
    }
    input:focus { border-color: #0fc; background: rgba(255,255,255,0.12); }
    input::placeholder { color: rgba(255,255,255,0.3); }
    button {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      background: linear-gradient(135deg, #0af, #0fc);
      color: #000;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; }
    .success h1 { font-size: 48px; margin-bottom: 16px; }
    .success p { font-size: 22px; color: #0fc; }
    .success .hint { font-size: 15px; color: #556; margin-top: 24px; }
  </style>
</head>
<body>
  <div id="build-info"><span id="build-version">v00</span><br><span id="build-started"></span></div>
  <div class="container" id="form">
    <h1>Join the Planet</h1>
    <input type="text" id="name" placeholder="Your name" autocomplete="off" autofocus />
    <button id="btn" onclick="join()">Launch!</button>
  </div>

  <div class="container success" id="done" style="display:none">
    <h1>&#127881;</h1>
    <p>You're in orbit, <strong id="who"></strong>!</p>
    <a id="my-orbit" href="/orbit.html" style="display:inline-block; margin-top:24px; padding:14px 28px; background:linear-gradient(135deg,#0af,#0fc); color:#000; border-radius:12px; text-decoration:none; font-weight:700; font-size:18px;">My orbit</a>
    <div class="hint">Look at the big screen</div>
  </div>

  <script>
    fetch('/api/version').then(r => r.json()).then(d => {
      document.getElementById('build-version').textContent = `v${d.build}`;
      const t = new Date(d.startedAt);
      document.getElementById('build-started').textContent = `started ${t.toLocaleDateString()} ${t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }).catch(() => {});

    const params = new URLSearchParams(location.search);
    const next = params.get('next');

    async function join() {
      const name = document.getElementById('name').value.trim();
      if (!name) return;
      document.getElementById('btn').disabled = true;
      try {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error('join failed');
        const user = await res.json();
        localStorage.setItem('userId', user.id);
        localStorage.setItem('userName', user.name);
        if (next) {
          location.href = next;
          return;
        }
        document.getElementById('form').style.display = 'none';
        document.getElementById('who').textContent = name;
        document.getElementById('done').style.display = 'block';
      } catch (e) {
        alert('Connection error');
        document.getElementById('btn').disabled = false;
      }
    }
    document.getElementById('name').addEventListener('keydown', e => {
      if (e.key === 'Enter') join();
    });
  </script>
</body>
</html>
