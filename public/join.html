<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --orbit-burgundy-200: #C78A93;
      --orbit-burgundy-300: #A8525F;
      --orbit-burgundy-400: #7E2A38;
      --orbit-burgundy-500: #5E1F2A;
      --orbit-burgundy-600: #3F141C;
      --orbit-slate-300: #8C95A3;
      --orbit-cream: #F4ECE4;
      --orbit-space-0: #0A0E16;
      --orbit-space-1: #131826;
      --font-display: 'Instrument Serif', 'Times New Roman', Georgia, serif;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #build-info {
      position: fixed;
      bottom: 16px;
      right: 20px;
      color: rgba(244,236,228,0.2);
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      user-select: none;
      line-height: 1.6;
    }
    body {
      background: var(--orbit-space-0);
      color: var(--orbit-cream);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container { text-align: center; max-width: 380px; width: 100%; }
    h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 40px;
      color: #fff;
    }
    input {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      font-family: var(--font-ui);
      border: 2px solid var(--orbit-burgundy-400);
      border-radius: 14px;
      background: rgba(244,236,228,0.04);
      color: var(--orbit-cream);
      outline: none;
      margin-bottom: 20px;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus { border-color: var(--orbit-burgundy-300); background: rgba(244,236,228,0.08); }
    input::placeholder { color: rgba(244,236,228,0.35); }
    button {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      font-family: var(--font-ui);
      background: var(--orbit-burgundy-400);
      color: var(--orbit-cream);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(126,42,56,0.3), 0 8px 20px rgba(0,0,0,0.3);
    }
    button:hover { background: var(--orbit-burgundy-300); transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; }
    .success h1 { font-size: 48px; margin-bottom: 16px; }
    .success p { font-size: 22px; color: var(--orbit-cream); }
    .success .hint { font-size: 15px; color: var(--orbit-slate-300); margin-top: 24px; }
  </style>
</head>
<body>
  <div id="build-info"><span id="build-version">v00</span><br><span id="build-started"></span></div>
  <div class="container" id="form">
    <h1>Join the Planet</h1>
    <input type="text" id="name" placeholder="Your name" autocomplete="off" autofocus />
    <button id="btn" onclick="join()">Launch!</button>
  </div>

  <div class="container success" id="done" style="display:none">
    <h1>&#127881;</h1>
    <p>You're in orbit, <strong id="who"></strong>!</p>
    <a id="my-orbit" href="/orbit.html" style="display:inline-block; margin-top:24px; padding:14px 28px; background:#7E2A38; color:#F4ECE4; border-radius:12px; text-decoration:none; font-weight:700; font-size:18px; font-family:'Inter',sans-serif; box-shadow:0 0 24px rgba(126,42,56,0.3); transition:background 0.2s;">My orbit</a>
    <div class="hint">Look at the big screen</div>
  </div>

  <script>
    fetch('/api/version').then(r => r.json()).then(d => {
      document.getElementById('build-version').textContent = `v${d.build}`;
      const t = new Date(d.startedAt);
      document.getElementById('build-started').textContent = `started ${t.toLocaleDateString()} ${t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }).catch(() => {});

    const params = new URLSearchParams(location.search);
    const next = params.get('next');

    async function join() {
      const name = document.getElementById('name').value.trim();
      if (!name) return;
      document.getElementById('btn').disabled = true;
      try {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error('join failed');
        const user = await res.json();
        localStorage.setItem('userId', user.id);
        localStorage.setItem('userName', user.name);
        if (next) {
          location.href = next;
          return;
        }
        document.getElementById('form').style.display = 'none';
        document.getElementById('who').textContent = name;
        document.getElementById('done').style.display = 'block';
      } catch (e) {
        alert('Connection error');
        document.getElementById('btn').disabled = false;
      }
    }
    document.getElementById('name').addEventListener('keydown', e => {
      if (e.key === 'Enter') join();
    });
  </script>
</body>
</html>
