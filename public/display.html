<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Planet</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
    #build-version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      user-select: none;
    }
    #qr-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }
    #qr-img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      background: white;
      padding: 8px;
    }
    #qr-url {
      color: #667;
      font-size: 14px;
      margin-top: 8px;
      font-family: monospace;
    }
    #user-count {
      position: fixed;
      top: 30px;
      right: 40px;
      color: #0af;
      font-size: 28px;
      font-weight: 600;
      z-index: 10;
    }
    #title {
      position: fixed;
      top: 30px;
      left: 40px;
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="build-version">v00</div>
  <div id="title">Scan to join</div>
  <div id="user-count">0 explorers</div>
  <div id="qr-container">
    <img id="qr-img" />
    <div id="qr-url"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 3000; i++) {
      starPos.push((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 })));

    // Planet
    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 64, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a5fb4, emissive: 0x0a2f6a, roughness: 0.6, metalness: 0.3 })
    );
    scene.add(planet);

    // Glow
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(2.6, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.12, side: THREE.BackSide })
    ));

    // Orbit rings
    for (let r = 4; r <= 8; r += 1.5) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.02, 8, 100),
        new THREE.MeshBasicMaterial({ color: 0x224466, transparent: true, opacity: 0.3 })
      );
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
    }

    // Lights
    scene.add(new THREE.AmbientLight(0x404060));
    const light = new THREE.PointLight(0xffffff, 1.5);
    light.position.set(10, 10, 10);
    scene.add(light);

    // User management
    const userObjects = [];
    const knownIds = new Set();
    const colors = ['#00ffcc', '#ff6cf0', '#ffcc00', '#00ccff', '#ff6633', '#66ff66', '#cc99ff', '#ff3366'];

    function createTextSprite(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'bold 48px -apple-system, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.fillText(text, 256, 64);
      ctx.shadowBlur = 0;
      ctx.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(4, 1, 1);
      return sprite;
    }

    function hashIndex(id) {
      const s = String(id);
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function addUser(user) {
      const color = colors[hashIndex(user.id) % colors.length];
      const sprite = createTextSprite(user.name, color);
      const orbitRadius = 3.5 + Math.random() * 5;
      const speed = 0.15 + Math.random() * 0.35;
      const startAngle = Math.random() * Math.PI * 2;
      const tiltAmount = (Math.random() - 0.5) * 1.2;

      // Small dot
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(color) })
      );
      scene.add(dot);
      scene.add(sprite);

      userObjects.push({ sprite, dot, orbitRadius, speed, startAngle, tiltAmount });
    }

    // Build version
    fetch('/api/version').then(r => r.json()).then(d => {
      document.getElementById('build-version').textContent = `v${d.build}`;
    }).catch(() => {});

    // Polling
    async function poll() {
      try {
        const res = await fetch('/api/users');
        const users = await res.json();
        const count = users.length;
        document.getElementById('user-count').textContent =
          `${count} explorer${count !== 1 ? 's' : ''}`;
        for (const u of users) {
          if (!knownIds.has(u.id)) {
            knownIds.add(u.id);
            addUser(u);
          }
        }
      } catch (e) {}
    }
    setInterval(poll, 1000);
    poll();

    // QR
    fetch('/api/qr').then(r => r.json()).then(data => {
      document.getElementById('qr-img').src = data.dataUrl;
      document.getElementById('qr-url').textContent = data.url;
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      const t = Date.now() * 0.001;

      planet.rotation.y = t * 0.08;

      for (const u of userObjects) {
        const angle = u.startAngle + t * u.speed;
        const x = Math.cos(angle) * u.orbitRadius;
        const y = Math.sin(u.tiltAmount) * Math.sin(angle) * u.orbitRadius * 0.25;
        const z = Math.sin(angle) * u.orbitRadius;
        u.sprite.position.set(x, y + 0.4, z);
        u.dot.position.set(x, y, z);
      }

      camera.position.x = Math.sin(t * 0.04) * 14;
      camera.position.z = Math.cos(t * 0.04) * 14;
      camera.position.y = 3 + Math.sin(t * 0.06) * 1.5;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
