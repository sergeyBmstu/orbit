<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaxy</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #05060d; overflow: hidden; font-family: -apple-system, sans-serif; }
    #build-info {
      position: fixed; bottom: 16px; right: 20px; text-align: right;
      color: rgba(255,255,255,0.2); font-size: 11px; font-family: monospace;
      z-index: 100; user-select: none; line-height: 1.6;
    }
    canvas { touch-action: none; cursor: default; display: block; }
    canvas.hover { cursor: pointer; }
    #title {
      position: fixed; top: 30px; left: 40px; z-index: 10;
      color: #fff; font-size: 24px; font-weight: 600;
    }
    #title small {
      display: block; font-size: 13px; color: #889; font-weight: 400; margin-top: 4px;
    }
    #count {
      position: fixed; top: 30px; right: 40px; z-index: 10;
      color: #8ce6ff; font-size: 18px; font-weight: 600;
    }
    #back {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 11;
      padding: 12px 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; color: #fff; font-size: 15px; text-decoration: none;
    }
    #back:hover { background: rgba(255,255,255,0.15); }
    #empty {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
      color: #889; font-size: 18px; text-align: center; display: none;
    }
    @media (max-width: 640px) {
      #title { top: max(env(safe-area-inset-top), 14px); left: 16px; font-size: 18px; }
      #title small { font-size: 11px; margin-top: 2px; }
      #count { top: max(env(safe-area-inset-top), 14px); right: 16px; font-size: 14px; }
      #back { bottom: max(env(safe-area-inset-bottom), 14px); padding: 10px 18px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="build-info"><span id="build-version">v00</span><br><span id="build-started"></span></div>
  <div id="title">Galaxy<small>everyone in the universe</small></div>
  <div id="count">0</div>
  <div id="empty">No explorers yet.<br><small>Be the first to join.</small></div>
  <a id="back" href="/orbit.html">My orbit</a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    fetch('/api/version').then(r => r.json()).then(d => {
      document.getElementById('build-version').textContent = `v${d.build}`;
      const t = new Date(d.startedAt);
      document.getElementById('build-started').textContent =
        `started ${t.toLocaleDateString()} ${t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }).catch(() => {});

    // ---------- Setup ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060d);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 5000);
    camera.position.set(0, 80, 520);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    // Stars
    {
      const starGeo = new THREE.BufferGeometry();
      const starPos = [];
      for (let i = 0; i < 5000; i++) {
        starPos.push((Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000, (Math.random() - 0.5) * 4000);
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 })));
    }

    // Lights (no sun — light from outside the disc)
    const keyLight = new THREE.PointLight(0xffe7c0, 2.5, 0, 1.4);
    keyLight.position.set(400, 600, 400);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x8090ff, 0.8, 0, 1.6);
    fillLight.position.set(-400, -200, -400);
    scene.add(fillLight);
    scene.add(new THREE.AmbientLight(0x8090a8, 0.5));

    const textureLoader = new THREE.TextureLoader();

    // ---------- Hash + RNG ----------
    function hashIndex(id) {
      const s = String(id);
      let h = 0x9e3779b9;
      for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x85ebca6b) | 0;
      return Math.abs(h);
    }
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ---------- Planet archetypes ----------
    const ARCHETYPES = [
      { name: 'gasWarm', tex: ['/textures/jupiter.jpg'] },
      { name: 'gasCold', tex: ['/textures/saturn.jpg'] },
      { name: 'ice',     tex: ['/textures/uranus.jpg', '/textures/neptune.jpg'] },
      { name: 'rocky',   tex: ['/textures/mercury.jpg', '/textures/mars.jpg', '/textures/moon.jpg'] },
      { name: 'lava',    tex: ['/textures/venus_surface.jpg'] },
      { name: 'ocean',   tex: ['/textures/earth_daymap.jpg'] },
    ];

    const _texCache = new Map();
    function loadTex(url) {
      let t = _texCache.get(url);
      if (t) return t;
      t = textureLoader.load(url);
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = 8;
      _texCache.set(url, t);
      return t;
    }

    function planetParamsFor(id) {
      const seed = hashIndex(id);
      const rng = mulberry32(seed);
      const arch = ARCHETYPES[Math.floor(rng() * ARCHETYPES.length)];
      const texUrl = arch.tex[Math.floor(rng() * arch.tex.length)];
      // ring chance — original used >0.78, slightly higher feels better visually here
      const rings = rng() > 0.74 && arch.name !== 'gasCold';
      const ringHue = ({
        gasWarm: 38, gasCold: 45, ice: 200, rocky: 20, lava: 10, ocean: 200,
      })[arch.name];
      return { archetype: arch.name, textureUrl: texUrl, rings, ringHue, seed };
    }

    function makeRingTexture(seed, hue) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 64;
      const ctx = c.getContext('2d');
      const rng = mulberry32(seed + 1);
      ctx.clearRect(0, 0, 512, 64);
      for (let i = 0; i < 32; i++) {
        const x = i * 16;
        const stripe = rng() > 0.5 ? `hsl(${hue}, 50%, 75%)` : 'rgba(255,255,255,0.85)';
        ctx.fillStyle = stripe;
        ctx.globalAlpha = 0.55 + rng() * 0.4;
        ctx.fillRect(x, 0, 16, 64);
      }
      ctx.globalAlpha = 1;
      const fade = ctx.createLinearGradient(0, 0, 512, 0);
      fade.addColorStop(0, 'rgba(0,0,0,1)');
      fade.addColorStop(0.08, 'rgba(0,0,0,0)');
      fade.addColorStop(0.92, 'rgba(0,0,0,0)');
      fade.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = fade;
      ctx.fillRect(0, 0, 512, 64);
      ctx.globalCompositeOperation = 'source-over';
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function createPlanetMesh(id, isMe) {
      const p = planetParamsFor(id);
      const radius = isMe ? 32 : 8;
      const group = new THREE.Group();
      const surf = new THREE.MeshStandardMaterial({
        map: loadTex(p.textureUrl),
        roughness: (p.archetype === 'ocean' || p.archetype === 'ice') ? 0.55 : 0.85,
        metalness: 0,
      });
      const core = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), surf);
      group.add(core);

      if (p.rings) {
        const ringInner = radius * 1.4;
        const ringOuter = radius * 2.1;
        const ringGeom = new THREE.RingGeometry(ringInner, ringOuter, 96, 1);
        // remap UVs radially
        const uv = ringGeom.attributes.uv;
        const pos = ringGeom.attributes.position;
        for (let i = 0; i < uv.count; i++) {
          const x = pos.getX(i), y = pos.getY(i);
          const r = Math.hypot(x, y);
          const angle = Math.atan2(y, x);
          uv.setXY(i, angle / (Math.PI * 2) + 0.5, (r - ringInner) / (ringOuter - ringInner));
        }
        uv.needsUpdate = true;
        const ringMat = new THREE.MeshBasicMaterial({
          map: makeRingTexture(p.seed, p.ringHue),
          side: THREE.DoubleSide,
          transparent: true,
          depthWrite: false,
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 2 - 0.35;
        ring.rotation.y = 0.15;
        group.add(ring);
      }

      group.userData.spinSpeed = 0.0015 + (mulberry32(p.seed)() * 0.003);
      group.userData.core = core;
      group.userData.radius = radius;
      return group;
    }

    function createNameSprite(text) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.font = 'bold 56px -apple-system, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(140, 200, 255, 0.8)';
      ctx.shadowBlur = 22;
      ctx.fillStyle = '#e7eaf6';
      ctx.fillText(text, 256, 64);
      ctx.shadowBlur = 0;
      ctx.fillText(text, 256, 64);
      const tex = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      sprite.scale.set(36, 9, 1);
      return sprite;
    }

    // ---------- Disc placement ----------
    const ORBIT_RADIUS = 360;
    function discPositionFor(id, index) {
      const rng = mulberry32(hashIndex(id) + index * 31);
      const theta = rng() * Math.PI * 2;
      const r = ORBIT_RADIUS + (rng() - 0.5) * 180;
      // Heavier vertical spread so a busy galaxy doesn't collapse into one ring.
      // Bias to a softer distribution via two summed randoms (~triangular).
      const y = ((rng() + rng()) - 1) * 220;
      return new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta));
    }

    // ---------- State ----------
    const myId = localStorage.getItem('userId');
    const planetById = new Map(); // id -> { group, sprite, pos }
    let edgeLines = null;

    function rebuild(galaxy) {
      const users = [...galaxy.users].sort((a, b) => a.id < b.id ? -1 : 1);
      const incoming = new Set(users.map(u => u.id));
      for (const [id, obj] of planetById.entries()) {
        if (!incoming.has(id)) {
          scene.remove(obj.group);
          scene.remove(obj.sprite);
          planetById.delete(id);
        }
      }
      users.forEach((u, i) => {
        let entry = planetById.get(u.id);
        const isMe = u.id === myId;
        const pos = isMe ? new THREE.Vector3(0, 0, 0) : discPositionFor(u.id, i);
        if (!entry) {
          const group = createPlanetMesh(u.id, isMe);
          group.position.copy(pos);
          group.userData.userId = u.id;
          group.userData.core.userData.userId = u.id;

          if (isMe) {
            const ringGeom = new THREE.TorusGeometry(group.userData.radius * 1.35, group.userData.radius * 0.04, 12, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffdc78, transparent: true, opacity: 0.85, toneMapped: false });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
          }

          const sprite = createNameSprite(u.name);
          const labelOffset = group.userData.radius + 10;
          if (isMe) sprite.scale.set(64, 16, 1);
          sprite.position.set(pos.x, pos.y + labelOffset, pos.z);

          scene.add(group);
          scene.add(sprite);
          entry = { group, sprite, pos, isMe, labelOffset };
          planetById.set(u.id, entry);
        } else {
          entry.pos = pos;
          entry.group.position.copy(pos);
          entry.sprite.position.set(pos.x, pos.y + entry.labelOffset, pos.z);
        }
      });

      // Edges
      if (edgeLines) {
        scene.remove(edgeLines);
        edgeLines.geometry.dispose();
        edgeLines.material.dispose();
        edgeLines = null;
      }
      const positions = [];
      for (const [a, b] of galaxy.edges) {
        const pa = planetById.get(a);
        const pb = planetById.get(b);
        if (!pa || !pb) continue;
        positions.push(pa.pos.x, pa.pos.y, pa.pos.z, pb.pos.x, pb.pos.y, pb.pos.z);
      }
      if (positions.length) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        edgeLines = new THREE.LineSegments(
          geo,
          new THREE.LineBasicMaterial({ color: 0x6da0ff, transparent: true, opacity: 0.45 })
        );
        scene.add(edgeLines);
      }

      const n = users.length;
      document.getElementById('count').textContent = n === 1 ? '1 explorer' : `${n} explorers`;
      document.getElementById('empty').style.display = n ? 'none' : 'block';
    }

    async function poll() {
      try {
        const res = await fetch('/api/galaxy');
        const data = await res.json();
        rebuild(data);
      } catch (e) {}
    }
    setInterval(poll, 1500);
    poll();

    // ---------- Picking ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function pick(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const targets = [];
      for (const o of planetById.values()) targets.push(o.group.userData.core);
      const hits = raycaster.intersectObjects(targets, false);
      return hits.length ? hits[0].object.userData.userId : null;
    }
    // ---------- Zoom ----------
    const MIN_DIST = 60;
    const MAX_DIST = 3000;
    let cameraDistance = 520;
    let userZoomed = false;

    function autoFit() {
      // Disc is in XZ plane; camera sits above it so the disc projects to a thin
      // ellipse — fitting to the camera's horizontal field-of-view is what counts.
      const halfSpan = ORBIT_RADIUS + 60;
      const vfov = camera.fov * Math.PI / 180;
      const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
      const distH = halfSpan / Math.tan(hfov / 2);
      // For very tall (portrait) screens the disc can poke out vertically too —
      // honour vertical fit only when it's the tighter constraint.
      const distV = halfSpan / Math.tan(vfov / 2);
      cameraDistance = Math.max(distH, camera.aspect < 1 ? distV : 0) * 1.05;
    }
    autoFit();

    function setZoom(d) {
      cameraDistance = Math.min(MAX_DIST, Math.max(MIN_DIST, d));
      userZoomed = true;
    }

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      setZoom(cameraDistance * (1 + e.deltaY * 0.004));
    }, { passive: false });

    // ---------- Camera orbit (drag) + pinch zoom ----------
    let azimuth = 0;             // around Y axis
    let polar = 1.30;            // from +Y axis; matches the previous 0.28y/d feel
    const POLAR_MIN = 0.18;
    const POLAR_MAX = Math.PI - 0.30; // keep camera above the disc
    let userRotated = false;

    let hovering = false;
    const TAP_THRESHOLD = 8;     // px — below this, pointerup = click
    const activePointers = new Map(); // id -> { x, y, dragged }
    let pinchStartDist = 0;
    let pinchStartCam = 0;

    canvas.addEventListener('pointermove', e => {
      // Hover state only matters when no pointer is pressed
      if (activePointers.size === 0) {
        hovering = !!pick(e);
        canvas.classList.toggle('hover', hovering);
      }
    });
    canvas.addEventListener('pointerleave', () => {
      hovering = false;
      canvas.classList.remove('hover');
    });

    canvas.addEventListener('pointerdown', e => {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, dragged: false });
      canvas.setPointerCapture?.(e.pointerId);
      if (activePointers.size === 2) {
        const [a, b] = [...activePointers.values()];
        pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        pinchStartCam = cameraDistance;
      }
    });

    canvas.addEventListener('pointermove', e => {
      const p = activePointers.get(e.pointerId);
      if (!p) return;
      const prevX = p.x, prevY = p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (Math.hypot(p.x - p.sx, p.y - p.sy) > TAP_THRESHOLD) p.dragged = true;

      if (activePointers.size === 2) {
        const [a, b] = [...activePointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        setZoom(pinchStartCam * (pinchStartDist / d));
      } else if (activePointers.size === 1) {
        const dx = p.x - prevX;
        const dy = p.y - prevY;
        // Drag horizontally → rotate around Y; vertically → tilt.
        // Distance-aware sensitivity keeps the drag-to-arc feel consistent across zoom levels.
        const k = 0.005;
        azimuth -= dx * k;
        polar -= dy * k;
        polar = Math.max(POLAR_MIN, Math.min(POLAR_MAX, polar));
        userRotated = true;
      }
    });

    function endPointer(e) {
      const p = activePointers.get(e.pointerId);
      activePointers.delete(e.pointerId);
      if (!p) return;
      // Treat a pointerup with no drag as a click on a planet
      if (!p.dragged && activePointers.size === 0) {
        const id = pick(e);
        if (id) location.href = `/orbit.html?id=${id}`;
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    // ---------- Animate ----------
    let sceneTime = 0;
    let lastFrame = performance.now();
    let timeScale = 1;
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now - lastFrame) / 1000;
      lastFrame = now;
      const target = hovering ? 0.05 : 1;
      timeScale += (target - timeScale) * Math.min(1, dt * 8);
      sceneTime += dt * timeScale;
      const t = sceneTime;

      // Planet self-spin
      for (const { group } of planetById.values()) {
        group.rotation.y += (group.userData.spinSpeed || 0) * timeScale * 60 * dt;
      }

      // Camera: drift azimuth automatically until the user starts dragging.
      if (!userRotated && activePointers.size === 0) {
        azimuth += dt * 0.04 * timeScale;
      }
      const sinP = Math.sin(polar);
      camera.position.x = sinP * Math.sin(azimuth) * cameraDistance;
      camera.position.y = Math.cos(polar) * cameraDistance;
      camera.position.z = sinP * Math.cos(azimuth) * cameraDistance;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if (!userZoomed) autoFit();
    });
  </script>
</body>
</html>
