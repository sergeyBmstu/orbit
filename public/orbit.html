<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Orbit</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
    canvas { touch-action: none; }
    #build-version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      font-family: monospace;
      z-index: 100;
      user-select: none;
    }
    #qr-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }
    #qr-img {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      background: white;
      padding: 8px;
    }
    #qr-url {
      color: #667;
      font-size: 12px;
      margin-top: 8px;
      font-family: monospace;
      max-width: 280px;
      word-break: break-all;
    }
    #user-count {
      position: fixed;
      top: 30px;
      right: 40px;
      color: #0af;
      font-size: 24px;
      font-weight: 600;
      z-index: 10;
    }
    #title {
      position: fixed;
      top: 30px;
      left: 40px;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      z-index: 10;
    }
    #title small {
      display: block;
      font-size: 13px;
      color: #889;
      font-weight: 400;
      margin-top: 4px;
    }
    #back {
      position: fixed;
      top: 30px;
      left: 40px;
      z-index: 11;
      padding: 10px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      display: none;
    }
    #back:hover { background: rgba(255,255,255,0.15); }
    #title.with-back { left: 160px; }
    #view-galaxy {
      position: fixed;
      top: 72px;
      right: 40px;
      z-index: 11;
      padding: 10px 16px;
      background: rgba(140, 200, 255, 0.12);
      border: 1px solid rgba(140, 200, 255, 0.35);
      border-radius: 10px;
      color: #cde6ff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    #view-galaxy:hover { background: rgba(140, 200, 255, 0.22); }
    canvas { cursor: default; }
    canvas.hover { cursor: pointer; }

    @media (max-width: 640px) {
      #title { top: max(env(safe-area-inset-top), 14px); left: 16px; font-size: 18px; }
      #title small { font-size: 11px; margin-top: 2px; }
      #title.with-back { left: 110px; font-size: 16px; }
      #user-count { top: max(env(safe-area-inset-top), 14px); right: 16px; font-size: 16px; }
      #view-galaxy { top: calc(max(env(safe-area-inset-top), 14px) + 30px); right: 16px; padding: 7px 12px; font-size: 11px; }
      #back { top: max(env(safe-area-inset-top), 14px); left: 14px; padding: 8px 12px; font-size: 12px; }
      #qr-container { bottom: max(env(safe-area-inset-bottom), 14px); }
      #qr-img { width: 120px; height: 120px; padding: 6px; border-radius: 10px; }
      #qr-url { font-size: 10px; max-width: 240px; margin-top: 6px; }
      #build-version { bottom: 8px; right: 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="build-version">v00</div>
  <a id="back" href="/orbit.html">&larr; My orbit</a>
  <a id="view-galaxy" href="/galaxy.html">View galaxy &rarr;</a>
  <div id="title">Loading…</div>
  <div id="user-count">0 planets</div>
  <div id="qr-container">
    <img id="qr-img" />
    <div id="qr-url"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    fetch('/api/version').then(r => r.json()).then(d => {
      document.getElementById('build-version').textContent = `v${d.build}`;
    }).catch(() => {});

    const myId = localStorage.getItem('userId');
    const params = new URLSearchParams(location.search);
    const viewId = params.get('id') || myId;
    const isOwn = !params.get('id') || params.get('id') === myId;

    if (!viewId) {
      location.replace('/join.html?next=/orbit.html');
    }
    if (!isOwn) {
      const back = document.getElementById('back');
      back.style.display = 'inline-block';
      back.href = myId ? '/orbit.html' : '/join.html';
      document.getElementById('title').classList.add('with-back');
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 3000; i++) {
      starPos.push((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 })));

    // Planet (the current user)
    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 64, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a5fb4, emissive: 0x0a2f6a, roughness: 0.6, metalness: 0.3 })
    );
    scene.add(planet);

    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(2.6, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.12, side: THREE.BackSide })
    ));

    for (let r = 4; r <= 8; r += 1.5) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.02, 8, 100),
        new THREE.MeshBasicMaterial({ color: 0x224466, transparent: true, opacity: 0.3 })
      );
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
    }

    scene.add(new THREE.AmbientLight(0x404060));
    const light = new THREE.PointLight(0xffffff, 1.5);
    light.position.set(10, 10, 10);
    scene.add(light);

    const planetObjects = [];
    const knownIds = new Set();
    const colors = ['#00ffcc', '#ff6cf0', '#ffcc00', '#00ccff', '#ff6633', '#66ff66', '#cc99ff', '#ff3366'];

    function hashIndex(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function createTextSprite(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;
      ctx.font = 'bold 48px -apple-system, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.fillText(text, 256, 64);
      ctx.shadowBlur = 0;
      ctx.fillText(text, 256, 64);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.scale.set(4, 1, 1);
      return sprite;
    }

    function addPlanet(p) {
      const seed = hashIndex(p.id);
      const color = colors[seed % colors.length];
      const sprite = createTextSprite(p.name, color);
      const orbitRadius = 3.5 + (seed % 100) / 100 * 5;
      const speed = 0.15 + ((seed >> 7) % 100) / 100 * 0.35;
      const startAngle = ((seed >> 13) % 1000) / 1000 * Math.PI * 2;
      const tiltAmount = (((seed >> 17) % 1000) / 1000 - 0.5) * 1.2;

      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 16, 16),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(color) })
      );
      dot.userData.userId = p.id;
      sprite.userData.userId = p.id;
      scene.add(dot);
      scene.add(sprite);
      planetObjects.push({ sprite, dot, orbitRadius, speed, startAngle, tiltAmount });
    }

    async function poll() {
      try {
        const res = await fetch(`/api/users/${viewId}`);
        if (res.status === 404) {
          if (isOwn) {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            location.replace('/join.html?next=/orbit.html');
          } else {
            document.getElementById('title').innerHTML = 'Unknown user';
          }
          return;
        }
        const user = await res.json();
        const title = document.getElementById('title');
        title.innerHTML = `${user.name}<small>${isOwn ? 'your orbit' : 'orbit'}</small>`;
        const count = user.planets.length;
        document.getElementById('user-count').textContent =
          `${count} planet${count !== 1 ? 's' : ''}`;
        for (const p of user.planets) {
          if (!knownIds.has(p.id)) {
            knownIds.add(p.id);
            addPlanet(p);
          }
        }
      } catch (e) {}
    }
    setInterval(poll, 1000);
    poll();

    fetch(`/api/qr/${viewId}`).then(r => r.json()).then(data => {
      document.getElementById('qr-img').src = data.dataUrl;
      document.getElementById('qr-url').textContent = data.url;
    });

    // Click + hover on planets
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const canvas = renderer.domElement;

    function pick(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const targets = [];
      for (const o of planetObjects) {
        targets.push(o.dot, o.sprite);
      }
      const hits = raycaster.intersectObjects(targets, false);
      return hits.length ? hits[0].object.userData.userId : null;
    }

    let hovering = false;
    canvas.addEventListener('pointermove', e => {
      hovering = !!pick(e);
      canvas.classList.toggle('hover', hovering);
    });
    canvas.addEventListener('pointerleave', () => {
      hovering = false;
      canvas.classList.remove('hover');
    });
    canvas.addEventListener('click', e => {
      const id = pick(e);
      if (id) location.href = `/orbit.html?id=${id}`;
    });

    let sceneTime = Date.now() * 0.001;
    let lastFrame = performance.now();
    let timeScale = 1;

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now - lastFrame) / 1000;
      lastFrame = now;

      const targetScale = hovering ? 0.05 : 1;
      timeScale += (targetScale - timeScale) * Math.min(1, dt * 8);
      sceneTime += dt * timeScale;
      const t = sceneTime;

      planet.rotation.y = t * 0.08;
      for (const u of planetObjects) {
        const angle = u.startAngle + t * u.speed;
        const x = Math.cos(angle) * u.orbitRadius;
        const y = Math.sin(u.tiltAmount) * Math.sin(angle) * u.orbitRadius * 0.25;
        const z = Math.sin(angle) * u.orbitRadius;
        u.sprite.position.set(x, y + 0.4, z);
        u.dot.position.set(x, y, z);
      }
      camera.position.x = Math.sin(t * 0.04) * 14;
      camera.position.z = Math.cos(t * 0.04) * 14;
      camera.position.y = 3 + Math.sin(t * 0.06) * 1.5;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
